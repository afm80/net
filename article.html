        function escapeHtml(value) {
            return String(value || '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));

        function resolveCategoryUrl(url, fallback) {

            try {
                const parsedUrl = new URL(value, window.location.href);
                const isGithubPagesUrl = parsedUrl.hostname.toLowerCase().endsWith('.github.io');
                const isProjectPath = /^\/net(?:\/|$)/i.test(parsedUrl.pathname);

                    name: value.name || value.nam || value.title || value.label || 'قسم',
                    parentId: value.parentId || null,
                    url: value.url || '',
                    children: []
                };
                emitted.add(id);
                const nextAncestors = new Set(ancestors);
                nextAncestors.add(id);
                entries.forEach(([childId, childValue]) => {
                    if (childValue?.parentId !== id) return;
                    const child = makeItem(childId, nextAncestors);
                    if (child) item.children.push(child);
                });
                return item;
            };
            entries
                .filter(([id, value]) => !value?.parentId || !map.has(value.parentId))
                .forEach(([id]) => {
                    const root = makeItem(id);
                    if (root) roots.push(root);
                });
            entries.forEach(([id]) => {
                const root = makeItem(id);
                if (root) roots.push(root);
            });
            return roots;
        }

        function loadCategories() {
            get(ref(db, 'categories')).then((snapshot) => {
                const bar = document.getElementById('categories-bar');
                syncStickyBarHeight();
                bar.innerHTML = `<a href="${getSiteUrl()}" class="category-link" data-id="home">الرئيسية</a>`;
                if (!snapshot.exists()) return;
                const roots = buildCategoryTree(snapshot.val());
                const escapeAttribute = (value) => String(value || '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
                const renderCategory = (category) => {
                    const children = category.children || [];
                    const submenu = children.length
                        ? `<div class="sub-menu">${children.map(renderCategory).join('')}</div>`
                        : '';
                    const categoryHref = escapeAttribute(resolveCategoryUrl(category.url, getSiteUrl(`?category=${encodeURIComponent(category.id)}`)));
                    return `<div class="category-item">
                        <a href="${categoryHref}" class="category-link${children.length ? ' category-parent-link' : ''}" data-id="${escapeAttribute(category.id)}">${escapeHtml(category.name)}</a>
                        ${children.length ? `<button type="button" class="category-toggle" title="فتح الأقسام الفرعية" aria-label="فتح الأقسام الفرعية لقسم ${escapeAttribute(category.name)}" aria-expanded="false">⌄</button>` : ''}
                        ${submenu}
                    </div>`;
                };
                bar.insertAdjacentHTML('beforeend', roots.map(renderCategory).join(''));
                syncStickyBarHeight();
                const toggleCategoryItem = (item) => {
                    const submenu = item.querySelector(':scope > .sub-menu');
                    const toggle = item.querySelector(':scope > .category-toggle');
                    if (!submenu) return;
                    if (window.innerWidth <= 768) {
                        const barBottom = bar.getBoundingClientRect().bottom;
                        document.documentElement.style.setProperty('--category-menu-top', `${Math.max(4, barBottom + 4)}px`);
                    }
                    const isOpen = item.classList.toggle('open');
                    if (toggle) toggle.setAttribute('aria-expanded', String(isOpen));
                };
                const toggleButtons = bar.querySelectorAll('.category-item > .category-toggle');
                toggleButtons.forEach((toggle) => {
                    toggle.addEventListener('click', (event) => {
                        event.preventDefault();
                        event.stopPropagation();
                        const parentItem = toggle.closest('.category-item');
                        toggleCategoryItem(parentItem);
                    });
                });
            }).catch(() => {
                document.getElementById('categories-bar').innerHTML = `<a href="${getSiteUrl()}" class="category-link">الرئيسية</a>`;
                syncStickyBarHeight();
            });
        }

        function syncStickyBarHeight() {
            const categoriesBar = document.getElementById('categories-bar');
            if (categoriesBar) document.documentElement.style.setProperty('--categories-bar-height', `${categoriesBar.offsetHeight}px`);
        }

        document.addEventListener('click', (event) => {
            document.querySelectorAll('.category-item.open').forEach((item) => {
                if (item.contains(event.target)) return;
                item.classList.remove('open');
                const toggle = item.querySelector(':scope > .category-toggle');
                if (toggle) toggle.setAttribute('aria-expanded', 'false');
            });
        });

        const searchArea = document.getElementById('search-area');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.querySelector('.search-btn');
        if (searchButton && searchArea && searchInput) {
            searchButton.addEventListener('click', () => {
                searchArea.classList.toggle('open');
                if (searchArea.classList.contains('open')) searchInput.focus();
            });
            searchArea.addEventListener('submit', (event) => {
                event.preventDefault();
                const query = searchInput.value.trim();
                window.location.href = getSiteUrl(query ? `?q=${encodeURIComponent(query)}` : '');
            });
        }

        function getEmbedUrl(url) {
            if (!url) return '';
            const trimmed = url.trim();
            try {
                const parsedUrl = new URL(trimmed);
                let videoId = '';
                if (parsedUrl.hostname === 'youtu.be') {
                    videoId = parsedUrl.pathname.slice(1);
                } else if (parsedUrl.hostname.includes('youtube.com')) {
                    if (parsedUrl.pathname === '/watch') videoId = parsedUrl.searchParams.get('v') || '';
                    if (parsedUrl.pathname.startsWith('/shorts/')) videoId = parsedUrl.pathname.split('/')[2] || '';
                    if (parsedUrl.pathname.startsWith('/live/')) videoId = parsedUrl.pathname.split('/')[2] || '';
                    if (parsedUrl.pathname.startsWith('/embed/')) videoId = parsedUrl.pathname.split('/')[2] || '';
                }
                if (videoId) {
                    const origin = window.location.protocol === 'http:' || window.location.protocol === 'https:'
                        ? `&origin=${encodeURIComponent(window.location.origin)}`
                        : '';
                    return `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?rel=0&playsinline=1${origin}`;
                }
            } catch (error) {
                return '';
            }
            return trimmed;
        }

        function isHlsUrl(url) {
            return /\.m3u8(?:$|[?#])/i.test(url || '')
                || /(?:format|type|protocol|stream)=?(?:hls|m3u8|application\/x-mpegurl)/i.test(url || '')
                || /(?:\/|\b)(?:hls|playlist|manifest|live\.m3u8)(?:\/|\b)/i.test(url || '');
        }

        function isDashUrl(url) {
            return /\.mpd(?:$|[?#])/i.test(url || '')
                || /(?:format|type|protocol|stream)=?(?:dash|mpd|application\/dash\+xml)/i.test(url || '');
        }

        function isFlvUrl(url) {
            return /\.(?:flv|ts)(?:$|[?#])/i.test(url || '')
                || /(?:format|type)=?(?:flv|mpegts|video\/mp2t)/i.test(url || '');
        }

        function loadHlsLibrary() {
            if (window.Hls) return Promise.resolve(window.Hls);
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js';
                script.onload = () => resolve(window.Hls);
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        function loadDashLibrary() {
            if (window.dashjs) return Promise.resolve(window.dashjs);
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.dashjs.org/latest/dash.all.min.js';
                script.onload = () => resolve(window.dashjs);
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        function loadMpegtsLibrary() {
            if (window.mpegts) return Promise.resolve(window.mpegts);
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js';
                script.onload = () => resolve(window.mpegts);
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        function showVideoError(video, message) {
            if (!video || video.dataset.videoErrorShown) return;
            video.dataset.videoErrorShown = 'true';
            video.insertAdjacentHTML('afterend', `<p class="video-error">${message}</p>`);
        }

        function setupHlsVideo(video, url) {
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                return;
            }
            loadHlsLibrary().then((Hls) => {
                if (!Hls || !Hls.isSupported()) throw new Error('HLS غير مدعوم في هذا المتصفح');
                const player = new Hls();
                video._streamPlayer = player;
                player.loadSource(url);
                player.attachMedia(video);
                video.addEventListener('error', () => showVideoError(video, 'تعذر تشغيل بث HLS. تحقق من الرابط والسماح بـ CORS.'));
            }).catch(() => {
                showVideoError(video, 'تعذر تشغيل رابط m3u8 في هذا المتصفح. تحقق من الرابط والسماح بـ CORS.');
            });
        }

        function setupDashVideo(video, url) {
            loadDashLibrary().then((dashjs) => {
                if (!dashjs || !dashjs.MediaPlayer) throw new Error('DASH غير مدعوم');
                const player = dashjs.MediaPlayer().create();
                video._streamPlayer = player;
                player.initialize(video, url, false);
                player.on(dashjs.MediaPlayer.events.ERROR, () => {
                    showVideoError(video, 'تعذر تشغيل بث DASH. تحقق من الرابط والسماح بـ CORS.');
                });
            }).catch(() => {
                showVideoError(video, 'تعذر تشغيل رابط mpd في هذا المتصفح.');
            });
        }

        function setupFlvVideo(video, url) {
            loadMpegtsLibrary().then((mpegts) => {
                if (!mpegts || !mpegts.isSupported()) throw new Error('FLV غير مدعوم');
                const player = mpegts.createPlayer({ type: 'flv', url });
                video._streamPlayer = player;
                player.attachMediaElement(video);
                player.load();
                player.play().catch(() => {});
                player.on(mpegts.Events.ERROR, () => showVideoError(video, 'تعذر تشغيل بث FLV أو MPEG-TS.'));
            }).catch(() => {
                showVideoError(video, 'تعذر تشغيل رابط FLV أو MPEG-TS في هذا المتصفح.');
            });
        }

        function setupVideoSource(video, url) {
            if (!video) return;
            if (isHlsUrl(url)) return setupHlsVideo(video, url);
            if (isDashUrl(url)) return setupDashVideo(video, url);
            if (isFlvUrl(url)) return setupFlvVideo(video, url);
            video.src = url;
            video.load();
            video.addEventListener('error', () => showVideoError(video, 'تعذر تشغيل رابط الفيديو. تحقق من الرابط والسماح بـ CORS.'), { once: true });
        }

        function buildShareHtml(title) {
            const pageUrl = encodeURIComponent(window.location.href);
            const encodedTitle = encodeURIComponent(title);
            return `<div class="share-actions" aria-label="مشاركة الموضوع">
                <span class="share-label">مشاركة الموضوع:</span>
                <button type="button" class="share-button share-trigger" id="share-trigger" title="إظهار خيارات المشاركة" aria-label="إظهار خيارات المشاركة" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="2"></circle><circle cx="6" cy="12" r="2"></circle><circle cx="18" cy="19" r="2"></circle><path d="m8 11 8-5M8 13l8 5"></path></svg></button>
                <div class="share-options" id="share-options">
                    <a class="share-button share-whatsapp" href="https://wa.me/?text=${encodedTitle}%20${pageUrl}" target="_blank" rel="noopener noreferrer" title="مشاركة عبر واتساب" aria-label="مشاركة عبر واتساب"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.66 15L2 22l5.18-1.32A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.08-1.12l-.29-.17-3.07.78.82-2.99-.19-.3A8 8 0 1 1 12 20Zm4.35-5.84c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.01-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.48-.4-.41-.54-.42h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.1.15 1.51.09.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28Z"></path></svg></a>
                    <a class="share-button share-facebook" href="https://www.facebook.com/sharer/sharer.php?u=${pageUrl}" target="_blank" rel="noopener noreferrer" title="مشاركة عبر فيسبوك" aria-label="مشاركة عبر فيسبوك"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8h2.7l.4-3h-3.1V9.1c0-.87.24-1.46 1.5-1.46h1.7V5a22 22 0 0 0-2.47-.13c-2.45 0-4.13 1.5-4.13 4.25V11H7.4v3h2.7v8h3.4Z"></path></svg></a>
                    <a class="share-button share-telegram" href="https://t.me/share/url?url=${pageUrl}&text=${encodedTitle}" target="_blank" rel="noopener noreferrer" title="مشاركة عبر تيليجرام" aria-label="مشاركة عبر تيليجرام"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m21.5 3.5-3.2 15.1c-.24 1.07-.87 1.34-1.76.84l-4.84-3.57-2.34 2.25c-.26.26-.48.48-.98.48l.35-4.93 8.97-8.1c.39-.35-.08-.55-.6-.2L6.02 11.9 1.25 10.4c-1.04-.33-1.06-1.04.22-1.54L20.1 1.58c.87-.32 1.63.2 1.4 1.92Z"></path></svg></a>
                    <a class="share-button share-x" href="https://twitter.com/intent/tweet?url=${pageUrl}&text=${encodedTitle}" target="_blank" rel="noopener noreferrer" title="مشاركة عبر X" aria-label="مشاركة عبر X"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-6.77 7.74L23.2 22h-6.24l-4.89-6.39L6.48 22H3.37l7.24-8.28L2.8 2h6.4l4.42 5.84L18.9 2Zm-1.1 17.9h1.73L8.26 4.02H6.4L17.8 19.9Z"></path></svg></a>
                    <button type="button" class="share-button share-copy" id="copy-article-link" title="نسخ رابط الموضوع" aria-label="نسخ رابط الموضوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"></path></svg></button>
                </div>
                <span class="share-status" id="share-status" aria-live="polite"></span>
                <div class="notification-prompt">
                    <button type="button" class="notification-button" id="article-notification-btn" title="تفعيل التنبيهات" aria-label="تفعيل التنبيهات">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                    <p class="notification-description">تلقّ تنبيهات وتحديثات فورية بحسب اهتمامك. كن أول من يعلم بالمواضيع</p>
                </div>
            </div>`;
        }

        function setupCopyLinkButton() {
            const copyButton = document.getElementById('copy-article-link');
            const status = document.getElementById('share-status');
            if (!copyButton || !status) return;
            copyButton.addEventListener('click', async () => {
                try {
                    if (navigator.clipboard?.writeText) {
                        await navigator.clipboard.writeText(window.location.href);
                    } else {
                        const helper = document.createElement('textarea');
                        helper.value = window.location.href;
                        helper.setAttribute('readonly', '');
                        helper.style.position = 'fixed';
                        helper.style.opacity = '0';
                        document.body.appendChild(helper);
                        helper.select();
                        document.execCommand('copy');
                        helper.remove();
                    }
                    status.textContent = 'تم نسخ الرابط';
                } catch (error) {
                    status.textContent = 'تعذر نسخ الرابط تلقائيًا';
                }
            });
        }

        function setupShareButton(title) {
            const trigger = document.getElementById('share-trigger');
            const options = document.getElementById('share-options');
            if (!trigger || !options) return;
            trigger.addEventListener('click', async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title,
                            text: `${title} - العراق نت`,
                            url: window.location.href
                        });
                        return;
                    } catch (error) {
                        if (error?.name === 'AbortError') return;
                    }
                }
                const open = options.classList.toggle('open');
                trigger.setAttribute('aria-expanded', String(open));
            });
        }

        function updateArticleShareMetadata(title, description, imageUrl) {
            const metadata = {
                'meta-description': description,
                'meta-og-title': title,
                'meta-og-description': description,
                'meta-og-image': imageUrl,
                'meta-og-secure-image': imageUrl,
                'meta-twitter-image': imageUrl
            };
            Object.entries(metadata).forEach(([id, value]) => {
                const element = document.getElementById(id);
                if (element) element.setAttribute('content', value || '');
            });
        }

        function setupArticleNotifications() {
            const button = document.getElementById('article-notification-btn');
            if (!button || !('Notification' in window)) {
                if (button) button.disabled = true;
                return;
            }
            if (Notification.permission === 'granted' || localStorage.getItem('notificationsEnabled') === 'true') {
                button.classList.add('enabled');
                button.title = 'التنبيهات مفعلة';
            }
            button.addEventListener('click', async () => {
                if (Notification.permission === 'denied') {
                    button.title = 'التنبيهات محظورة من إعدادات المتصفح';
                    return;
                }
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') return;
                localStorage.setItem('notificationsEnabled', 'true');
                button.classList.add('enabled');
                button.title = 'التنبيهات مفعلة';
                new Notification('العراق نت', {
                    body: 'تم تفعيل تنبيهات الموقع بنجاح',
                    icon: 'https://e.top4top.io/p_3903807hh1.png',
                    badge: 'https://e.top4top.io/p_3903807hh1.png'
                });
            });
        }

        loadCategories();
        if ('ResizeObserver' in window) new ResizeObserver(syncStickyBarHeight).observe(document.getElementById('categories-bar'));
        window.addEventListener('resize', syncStickyBarHeight);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=30').catch(() => {});
        setupInstallPrompt();
        setupThemeToggle();
        get(ref(db, 'articles')).then(renderLatestTicker).catch(() => renderLatestTicker({ exists: () => false }));

        if (articleId) {
            get(ref(db, 'articles/' + articleId)).then((snapshot) => {
                const container = document.getElementById('article-container');
                if (snapshot.exists()) {
                    const art = snapshot.val();
                    const title = art.title || 'عنوان غير متاح';
                    document.title = title;
                    const content = art.content || 'لا توجد تفاصيل لهذا المقال.';

                    let videoHtml = '';
                    const videoUrls = Array.isArray(art.videoUrls) && art.videoUrls.length
                        ? art.videoUrls.filter(Boolean)
                        : (art.videoUrl ? [art.videoUrl] : []);
                    const youtubeVideoUrls = videoUrls.filter((videoUrl) => getEmbedUrl(videoUrl).includes('youtube.com/embed'));
                    videoUrls.forEach((videoUrl, index) => {
                        const processedUrl = getEmbedUrl(videoUrl);
                        if (processedUrl.includes('youtube.com/embed')) {
                            videoHtml += `<div class="video-container"><iframe src="${processedUrl}" title="فيديو الموضوع" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="origin" allowfullscreen></iframe></div>`;
                        } else {
                            videoHtml += `<div class="video-container"><video id="article-video-${index}" controls playsinline preload="metadata"></video></div>`;
                        }
                    });
                    const contentText = String(content).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
                    const normalizedTitle = String(title).replace(/\s+/g, ' ').trim();
                    const placeholderTexts = new Set(['لا توجد تفاصيل لهذا المقال.', 'العراق نت', normalizedTitle]);
                    const hasArticleText = contentText && !placeholderTexts.has(contentText);
                    const hasCustomImage = Boolean(String(art.imageUrl || '').trim());
                    const hasContentImage = /<img\b/i.test(String(content));
                    const hasVideo = videoUrls.length > 0;
                    const hasYoutubeVideo = youtubeVideoUrls.length > 0;
                    const hasArticleDetails = hasArticleText || hasCustomImage || hasContentImage;
                    const isYoutubeOnly = hasYoutubeVideo && !hasArticleDetails;
                    const isVideoOnly = hasVideo && !hasArticleDetails;
                    const imageUrl = art.imageUrl || 'https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfaham%20net%20(1).png';
                    const mainImageHtml = hasCustomImage ? `<img src="${imageUrl}" alt="${title}" class="main-img">` : '';
                    const shareDescription = contentText.slice(0, 160);
                    updateArticleShareMetadata(title, shareDescription, imageUrl);

                    let extraImagesHtml = '';
                    if (art.extraImages) {
                        const imgs = art.extraImages.split(',');
                        let imgTags = '';
                        imgs.forEach(img => {
                            if (img && img.trim()) {
                                imgTags += `<img src="${img.trim()}" alt="صورة إضافية">`;
                            }
                        });
                        if (imgTags) {
                            extraImagesHtml = `<div class="extra-images">${imgTags}</div>`;
                        }
                    }

                    container.innerHTML = `
                        <h1>${title}</h1>
                        ${mainImageHtml}
                        ${videoHtml}
                        ${isVideoOnly ? '' : `<div class="content">${content}</div>`}
                        ${buildShareHtml(title)}
                        ${extraImagesHtml}
                    `;
                    setupCopyLinkButton();
                    setupShareButton(title);
                    setupArticleNotifications();
                    videoUrls.forEach((videoUrl, index) => {
                        const processedUrl = getEmbedUrl(videoUrl);
                        if (!processedUrl.includes('youtube.com/embed')) {
                            setupVideoSource(document.getElementById(`article-video-${index}`), videoUrl);
                        }
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; color: red;">الموضوع غير موجود.</p>';
                }
            }).catch(() => {
                document.getElementById('article-container').innerHTML = '<p style="text-align: center; color: red;">حدث خطأ أثناء تحميل الموضوع.</p>';
            });
        } else {
            document.getElementById('article-container').innerHTML = '<p style="text-align: center; color: red;">لم يتم تحديد الموضوع.</p>';
        }
    </script>
</body>
